<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Length Converter</title>
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div class="tall-box">
        <div class="title">Unit Converter</div>
        <div class="buttons">
            <a href="/length" class="btn active">Length</a>
            <a href="/weight" class="btn">Weight</a>
            <a href="/temperature" class="btn">Temperature</a>
        </div>
        <form action="/convert_length" method="POST" class="form">
            <label for="value">Enter the length to convert</label>
            <input type="text" id="value" name="value" class="textfield">

            <label for="from-unit">Unit to convert from</label>
            <input type="text" id="from-unit" name="from_unit" class="textfield">

            <label for="to-unit">Unit to convert to</label>
            <input type="text" id="to-unit" name="to_unit" class="textfield">

            <button type="submit" class="btn">Convert</button>
        </form>

        <div class="info-box">
            <h3>Supported Units</h3>
            <ul>
                <li>Meters (m)</li>
                <li>Kilometers (km)</li>
                <li>Centimeters (cm)</li>
                <li>Millimeters (mm)</li>
                <li>Inches (in)</li>
                <li>Feet (ft)</li>
                <li>Yards (yd)</li>
                <li>Miles (mi)</li>
            </ul>
        </div>

        <script>
            document.querySelector('form').addEventListener('submit', async function (event) {
                const valueField = document.getElementById('value');
                const fromUnitField = document.getElementById('from-unit');
                const toUnitField = document.getElementById('to-unit');

                if (!valueField.value.trim() || !fromUnitField.value.trim() || !toUnitField.value.trim()) {
                    alert('Please fill in all fields before converting.');
                    event.preventDefault();
                    return;
                }

                try {
                    const response = await fetch('/validate_units', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            from_unit: fromUnitField.value,
                            to_unit: toUnitField.value,
                            category: 'length'
                        })
                    });

                    const data = await response.json();
                    if (!data.valid) {
                        alert('One or more units are not recognized. Please check your input.');
                        event.preventDefault();
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred while validating units.');
                    event.preventDefault();
                }
            });

            document.querySelectorAll('.buttons a').forEach(link => {
                link.addEventListener('click', function (event) {
                    event.preventDefault();
                    window.location.href = this.href;
                });
            });
        </script>
    </div>
</body>

</html>
