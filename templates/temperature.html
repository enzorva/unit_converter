<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div class="tall-box">
        <div class="title">Unit Converter</div>
        <div class="buttons">
            <a href="/length" class="btn">Length</a>
            <a href="/weight" class="btn">Weight</a>
            <a href="/temperature" class="btn active">Temperature</a>
        </div>
        <form action="/convert_temperature" method="POST" class="form">
            <label for="value">Enter the temperature to convert</label>
            <input type="text" id="value" name="value" class="textfield">

            <label for="from-unit">Unit to convert from</label>
            <input type="text" id="from-unit" name="from_unit" class="textfield">

            <label for="to-unit">Unit to convert to</label>
            <input type="text" id="to-unit" name="to_unit" class="textfield">

            <button type="submit" class="btn">Convert</button>
        </form>

        <script>
            document.querySelector('form').addEventListener('submit', function (event) {
                const valueField = document.getElementById('value');
                const fromUnitField = document.getElementById('from-unit');
                const toUnitField = document.getElementById('to-unit');

                if (!valueField.value.trim() || !fromUnitField.value.trim() || !toUnitField.value.trim()) {
                    alert('Please fill in all fields before converting.');
                    event.preventDefault();
                }
            });

            document.querySelectorAll('.buttons a').forEach(link => {
                link.addEventListener('click', function (event) {
                    event.preventDefault();
                    window.location.href = this.href;
                });
            });
        </script>
    </div>
</body>

</html>
